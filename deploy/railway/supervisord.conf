[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
command=python -m uvicorn api:app --host 127.0.0.1 --port 8010
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/bin/npm run start
directory=/app/frontend
environment=PATH="/usr/bin:/usr/local/bin",PORT=3000,HOSTNAME="0.0.0.0",NODE_ENV="production",BACKEND_API_BASE="http://127.0.0.1:8010",NEXT_PUBLIC_API_BASE=""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
