services:
  backend:
    build:
      context: ./backend
    container_name: clipforge-backend
    environment:
      IN_DOCKER: "1"
      DATA_DIR: /app/data
      CORS_ORIGINS: "*"
      CLIPFORGE_COMPUTE: ${CLIPFORGE_COMPUTE:-modal}
      MODAL_GPU_BASE_URL: ${MODAL_GPU_BASE_URL:-}
      MODAL_PROXY_KEY: ${MODAL_PROXY_KEY:-}
      MODAL_PROXY_SECRET: ${MODAL_PROXY_SECRET:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:43123/api/drive/callback}
    volumes:
      - clipforge-data:/app/data
      - clipforge-models:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    expose:
      - "8010"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ""
    container_name: clipforge-frontend
    environment:
      BACKEND_API_BASE: http://backend:8010
      NEXT_PUBLIC_API_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    expose:
      - "3000"

  gateway:
    image: nginx:1.27-alpine
    container_name: clipforge-gateway
    ports:
      - "${APP_PORT:-43123}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clipforge-data:
  clipforge-models:
